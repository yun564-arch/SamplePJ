<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>

    <style>
        /* 画面全体 */
        body {
            display: flex;
            justify-content: center; /* 横中央 */
            align-items: flex-start; /* 上寄せ */
            padding-top: 100px;      /* 上からの余白 */
            background-color: #f5f5f5;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
        }
        .card {
            background-color: white;
			border: 1px solid #dddddd;
            padding: 30px;
            width: 350px;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* エラーメッセージ */
        .error {
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }

        /* 入力欄を縦並び */
        .form-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 入力欄 */
        .input-box {
            padding: 10px;
            font-size: 16px;
        }

        /* 登録ボタン */
        .register-btn {
            background-color: green;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .register-btn:hover {
            opacity: 0.8;
        }

        /* ログインリンク */
        .login-link {
			color: deepskyblue;
            display: block;
            text-align: center;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="card">

        <div class="title">
            ユーザー登録
        </div>

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>

        <form th:action="@{/register}" method="post">

            <div class="form-area">
			<label>ユーザー名（半角英字）</label>
                <input type="text"
                       name="username"
                       class="input-box">
			   
					   
		   <label>パスワード（半角英字）</label>
                <input type="password"
                       name="password"
                       class="input-box">

                <button type="submit"
                        class="register-btn">
						
                    登録
                </button>

            </div>

        </form>

        <a th:href="@{/login}" class="login-link">
            ログインはこちら
        </a>

    </div>

</body>

</html>
