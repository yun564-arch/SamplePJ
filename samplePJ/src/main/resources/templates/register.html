<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>

    <style>
        body { display: flex; justify-content: center; align-items: flex-start; padding-top: 100px; background-color: #f5f5f5; font-family: "Hiragino Sans", "Meiryo", sans-serif; }
        .card { background-color: white; border: 1px solid #dddddd; padding: 30px; width: 350px; }
        .title { text-align: center; font-size: 30px; font-weight: bold; margin-bottom: 25px; }
        .error { color: red; margin-bottom: 15px; text-align: center; }
        .field-error { color: red; font-size: 13px; margin-top: 4px; display: block; }
        .form-area { display: flex; flex-direction: column; gap: 15px; }
        .input-box { padding: 10px; font-size: 16px; }
        .register-btn { background-color: green; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .register-btn:hover { opacity: 0.8; }
        .login-link { color: deepskyblue; display: block; text-align: center; margin-top: 20px; }
    </style>
</head>

<body>

    <div class="card">

        <div class="title">ユーザー登録</div>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${login}">

            <div class="form-area">
                <label>ユーザー名（半角英字）</label>
                <input type="text" th:field="*{username}" class="input-box">
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

                <label>パスワード（半角英字）</label>
                <input type="password" th:field="*{password}" class="input-box">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

                <button type="submit" class="register-btn">登録</button>

            </div>

        </form>

        <a th:href="@{/login}" class="login-link">ログインはこちら</a>

    </div>

</body>

</html>
