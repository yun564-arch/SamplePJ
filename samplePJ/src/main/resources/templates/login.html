<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>

	<style>
		body {
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding-top: 100px;
			background-color: #f5f5f5;
			font-family: "Hiragino Sans", "Meiryo", sans-serif;
		}

		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.card {
			background-color: white;
			padding: 30px;
			border: 1px solid #dddddd;
			width: 350px;
		}

		.title {
			text-align: center;
			font-size: 30px;
			font-weight: bold;
			margin-bottom: 25px;
		}

		.error {
			color: red;
			margin-bottom: 15px;
			text-align: center;
		}

		.form-area {
			display: flex;
			flex-direction: column;
			gap: 15px;
		}

		.input-box {
			padding: 10px;
			font-size: 16px;
		}

		.login-btn {
			background-color: blue;
			color: white;
			border: none;
			padding: 12px;
			border-radius: 5px;
			cursor: pointer;
			font-size: 16px;
		}

		.register-link {
			display: block;
			text-align: center;
			margin-top: 20px;
			color: deepskyblue;
		}
		
	</style>
</head>

<body>
	<div class="container">

		<div class="title">
			ログイン
		</div>

		<div class="card">
			<!-- エラーメッセージ -->
			<div class="error" th:if="${error}" th:text="${error}">
			</div>

			<form th:action="@{/login}" method="post">

				<div class="form-area">

					<label>ユーザー名</label>
					<input type="text" name="username" class="input-box">

					<label>パスワード</label>
					<input type="password" name="password" class="input-box">

					<button type="submit" class="login-btn">
						ログイン
					</button>
				</div>
			</form>

			<a th:href="@{/register}" class="register-link">
				ユーザー登録はこちら
			</a>
		</div>

	</div>

</body>

</html>
