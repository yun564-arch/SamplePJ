<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク編集</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body class="page-body">

    <h1>タスク編集</h1>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/tasks/update/{id}(id=${task.id})}" method="post" th:object="${task}">
        <div class="form-area">
            <div>
                <label for="title">タイトル</label>
                <input type="text" id="title" th:field="*{title}" class="input-box">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div>
                <label for="content">内容</label>
                <textarea id="content" th:field="*{content}" class="input-box"></textarea>
            </div>
            <div>
                <label for="registrantName">登録者</label>
                <input type="text" id="registrantName" th:field="*{registrantName}" class="input-box">
            </div>
            <div>
                <label for="startDate">開始日</label>
                <input type="date" id="startDate" th:field="*{startDate}" class="input-box">
            </div>
            <div>
                <label for="endDate">終了日</label>
                <input type="date" id="endDate" th:field="*{endDate}" class="input-box">
                <span class="field-error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span>
            </div>
        </div>

        <div class="button-area">
            <button type="submit" class="btn btn-primary">更新</button>
            <a th:href="@{/tasks}" class="btn btn-secondary">← キャンセル</a>
        </div>
    </form>

</body>
</html>
