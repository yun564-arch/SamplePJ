<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク一覧</title>

	<style>
		body {
			font-family: "Hiragino Sans", "Meiryo", sans-serif;
			margin: 20px;
			color: #222;
		}


		h1 {
			text-align: center;
			font-size: 32px;
			margin-bottom: 30px;
		}

		.no-task-message {
			text-align: center;
			margin-top: 40px;
			font-size: 18px;
			color: #555555;
			
			background-color: #d9f2ff;
			 border: 1px solid #99d6ff;
			 padding: 15px;
			 border-radius: 5px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th {
			background-color: #22272b;
			color: white;
			padding: 12px 10px;
			text-align: left;
		}

		td {
			padding: 12px 10px;
			border-bottom: 1px solid #dddddd;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		.edit-btn {
			background-color: #007bff;
			color: white;
			padding: 8px 12px;
			text-decoration: none;
			border-radius: 4px;
			display: inline-block;
		}

		.delete-form {
			display: inline;
		}

		.delete-btn {
			background-color: #dc3545;
			color: white;
			border: none;
			padding: 8px 12px;
			border-radius: 4px;
			cursor: pointer;
			font-size: 16px;
		}
		.pagination {
		    text-align: center;
		    margin-top: 30px;
		}

		.pagination a,
		.pagination span {
		    margin: 0 5px;
		}

		.new-btn-area {
			text-align: right;
			margin-top: 30px;
		}

		.new-btn {
			background-color: #198754;
			color: white;
			padding: 10px 16px;
			text-decoration: none;
			border-radius: 5px;
			display: inline-block;
			
		}
		.logout-btn {
		    background-color: #6c757d;
		    color: white;
		    padding: 8px 12px;
		    text-decoration: none;
		    border-radius: 4px;
		}
	</style>
</head>

<body>

	<h1>タスク一覧</h1>
	
	<div style="text-align: right; margin-bottom: 20px;">
	    <a th:href="@{/logout}">ログアウト</a>
	</div>

	<div class="no-task-message" th:if="${#lists.isEmpty(tasks)}">
		📪現在タスクは登録されていません。「新規作成」から追加してください。
	</div>

	<table th:if="${!#lists.isEmpty(tasks)}">
		<tr>
			<th>ID</th>
			<th>タイトル</th>
			<th>内容</th>
			<th>登録者</th>
			<th>開始日</th>
			<th>終了日</th>
			<th>作成日時</th>
			<th>更新日時</th>
			<th>操作</th>
		</tr>

		<tr th:each="task : ${tasks}">
			<td th:text="${task.id}"></td>
			<td th:text="${task.title}"></td>
			<td th:text="${task.content}"></td>
			<td th:text="${task.name}"></td>
			<td th:text="${task.startDate}"></td>
			<td th:text="${task.endDate}"></td>
			<td th:text="${task.createdAt}"></td>
			<td th:text="${task.updatedAt}"></td>

			<td>
				<a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="edit-btn">
					編集
				</a>

				<form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post" class="delete-form">
					<button type="submit" class="delete-btn">
						削除
					</button>
				</form>
			</td>
		</tr>
	</table>
	
	<div class="pagination"
	     th:if="${totalPages > 1}">

	    <a th:if="${currentPage > 1}"
	       th:href="@{/tasks(page=${currentPage - 1})}">
	        前へ
	    </a>

	    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
	        <a th:if="${i != currentPage}"
	           th:href="@{/tasks(page=${i})}"
	           th:text="${i}">
	        </a>

	        <span th:if="${i == currentPage}"
	              th:text="${i}">
	        </span>
	    </span>

	    <a th:if="${currentPage < totalPages}"
	       th:href="@{/tasks(page=${currentPage + 1})}">
	        次へ
	    </a>

	</div>

	<div class="new-btn-area">
		<a th:href="@{/tasks/new}" class="new-btn">
			＋ 新規作成
		</a>
	</div>

</body>

</html>
