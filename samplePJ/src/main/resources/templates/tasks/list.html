<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

    <h1>タスク一覧</h1>

    <div class="header-area">
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn btn-secondary">
                ログアウト
            </button>
        </form>
    </div>

    <div class="no-task-message" th:if="${#lists.isEmpty(tasks)}">
        📪現在タスクは登録されていません。「新規作成」から追加してください。
    </div>

    <table th:if="${!#lists.isEmpty(tasks)}">
        <tr>
            <th>ID</th>
            <th>タイトル</th>
            <th>内容</th>
            <th>登録者</th>
            <th>開始日</th>
            <th>終了日</th>
            <th>作成日時</th>
            <th>更新日時</th>
            <th>操作</th>
        </tr>

        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}"></td>
            <td th:text="${task.title}"></td>
            <td th:text="${task.content}"></td>
            <td th:text="${task.registrantName}"></td>
            <td th:text="${task.startDate}"></td>
            <td th:text="${task.endDate}"></td>
            <td th:text="${#temporals.format(task.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td th:text="${#temporals.format(task.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>

            <td>
                <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-primary">
                    編集
                </a>
                <form th:action="@{/tasks/delete/{id}(id=${task.id})}" method="post" class="delete-form">
                    <button type="submit" class="btn btn-danger">
                        削除
                    </button>
                </form>
            </td>
        </tr>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 1}" th:href="@{/tasks(page=${currentPage - 1})}">前へ</a>

        <span th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:if="${i != currentPage}" th:href="@{/tasks(page=${i})}" th:text="${i}"></a>
            <span th:if="${i == currentPage}" th:text="${i}"></span>
        </span>

        <a th:if="${currentPage < totalPages}" th:href="@{/tasks(page=${currentPage + 1})}">次へ</a>
    </div>

    <div class="new-btn-area">
        <a th:href="@{/tasks/new}" class="btn btn-success">
            ＋ 新規作成
        </a>
    </div>

</body>

</html>
